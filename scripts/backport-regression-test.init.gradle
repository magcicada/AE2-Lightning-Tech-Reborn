// Forge 1.20.1 regression suite for the alpha 21926da..7d772cf backport.
// Run with Java 17: gradlew -I scripts/backport-regression-test.init.gradle runGameTestServer
// Fixtures use a disposable world and are excluded from release jars.
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes([
                '**/ForgeCraftingInput.java', '**/MiningFactoryGameTests.java',
                '**/OverloadedIOPortGameTests.java', '**/RainbowPigmeeGameTests.java',
                '**/PigmeeBuildingGameTests.java', '**/ProviderReturnFilterGameTests.java',
                '**/PhaseLockCreativeRecoveryGameTests.java',
                '**/PhaseFlightAndLockGameTests.java', '**/PhaseFlightGroundCrouchGameTests.java',
                '**/OverloadProcessingRecipeSyncGameTests.java', '**/TianshuWirelessBindingGameTests.java'])
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/backport-regression-forge')
            property 'forge.enabledGameTestNamespaces',
                    'ae2lt,ae2lt_mining,ae2lt_io,ae2lt_phase,ae2lt_phase_lock,ae2lt_main_fixes,ae2lt_wireless_binding'
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
